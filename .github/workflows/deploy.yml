name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Hetzner
        env:
          # No secrets||vars fallbacks. DEPLOY_PATH is a repository variable.
          # DEPLOY_SSH_PORT is optional; the script defaults an empty value to 22.
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${DEPLOY_HOST}" ]] || missing+=(DEPLOY_HOST)
          [[ -n "${DEPLOY_USER}" ]] || missing+=(DEPLOY_USER)
          [[ -n "${DEPLOY_SSH_KEY}" ]] || missing+=(DEPLOY_SSH_KEY)
          [[ -n "${DEPLOY_KNOWN_HOSTS}" ]] || missing+=(DEPLOY_KNOWN_HOSTS)
          [[ -n "${DEPLOY_PATH}" ]] || missing+=(DEPLOY_PATH)
          if ((${#missing[@]} > 0)); then
            echo "Deploy configuration missing: ${missing[*]}" >&2
            echo "Required secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS." >&2
            echo "Required repository variable: DEPLOY_PATH." >&2
            echo "Optional secret: DEPLOY_SSH_PORT (defaults to 22)." >&2
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          unset DEPLOY_KNOWN_HOSTS
          export DEPLOY_SSH_KEY=~/.ssh/deploy_key
          chmod +x deploy/remote-deploy.sh
          ./deploy/remote-deploy.sh
