services:
  backend-scrabble:
    container_name: scrabble_backend
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres-scrabble:5432/${POSTGRES_DB:-scrabble}
      - PORT=8200
      - NODE_ENV=production
      - BASE_PATH=/scrabble
      - CORS_ORIGIN=https://games.carloseduardo.es
    ports:
      - "8200:8200"
    depends_on:
      postgres-scrabble:
        condition: service_healthy
    command: bun run start
    networks:
      - appnet_scrabble
    restart: unless-stopped

  postgres-scrabble:
    container_name: scrabble_db
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-scrabble}
    volumes:
      - postgres_data_scrabble:/var/lib/postgresql/data
    networks:
      - appnet_scrabble
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend-scrabble:
    container_name: scrabble_frontend
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_API_URL: https://games.carloseduardo.es/scrabble/api
        VITE_SOCKET_URL: https://games.carloseduardo.es
    command: bun run preview -- --host 0.0.0.0 --port 3200
    ports:
      - "3200:3200"
    depends_on:
      - backend-scrabble
    networks:
      - appnet_scrabble
    restart: unless-stopped

volumes:
  postgres_data_scrabble:

networks:
  appnet_scrabble:
